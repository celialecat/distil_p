[project]
name = "distil-backend"
version = "0.1.0"
description = "FastAPI orchestration service for task-conditioned LLM distillation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
transformers = ["peft>=0.13,<1", "torch>=2.4,<3", "transformers>=4.46,<5"]
train = ["peft>=0.13,<1", "torch>=2.4,<3", "transformers>=4.46,<5", "datasets>=3.0,<4"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
