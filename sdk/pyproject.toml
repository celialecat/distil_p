[project]
name = "distil-sdk"
version = "0.1.0"
description = "Python client for the Distil model distillation platform."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
